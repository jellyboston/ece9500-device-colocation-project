; Copy to private_build_flags.ini ONLY if you do not already have that private file.
; Preserve your teammate's existing flags and their working string quoting.
; Placeholders only: PI_HOTSPOT_IPV4 must become the Pi's reachable hotspot IP.
[security]
build_flags =
    -Dwifi_ssid=\"YOUR_HOTSPOT_NAME\"
    -Dwifi_pass=\"YOUR_HOTSPOT_PASSWORD\"
    -DPI_TCP_HOST=\"PI_HOTSPOT_IPV4\"
    -DPI_TCP_PORT=9000
    -DRX_RECEIVER_ID=\"RX1\"
