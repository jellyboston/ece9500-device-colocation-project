; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c61-devkitc1-n8r2
extra_configs =
    private_build_flags.ini

[env:esp32-c61-devkitc1-n8r2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c61-devkitc1-n8r2
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
    ${security.build_flags}
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DCSI_CHANNEL=1
    -DTX_INTERVAL_MS=10
 
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

[env:esp32-c61-rx-tcp]
extends = env:esp32-c61-devkitc1-n8r2
build_flags =
    ${env:esp32-c61-devkitc1-n8r2.build_flags}
    -DROLE=1
    -DRX_TCP_ENABLED=1

[env:esp32-c61-rx-serial]
extends = env:esp32-c61-devkitc1-n8r2
build_flags =
    ${env:esp32-c61-devkitc1-n8r2.build_flags}
    -DROLE=1
    -DRX_TCP_ENABLED=0
